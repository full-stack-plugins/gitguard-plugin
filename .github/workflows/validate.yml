name: Validate GitFlow
on:
  push:
    branches: [main, fix/cli-install-safety-20261028]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            machine: x86_64
          - os: macos-latest
            python: '3.13'
            machine: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify target architecture from the actual runtime
        run: python -c "import platform; print(platform.platform(), platform.machine()); assert platform.machine().lower() == '${{ matrix.machine }}'"
      - run: python3 scripts/validate_package.py
      - run: python3 scripts/vendor_skills.py --check
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
  windows-launcher-candidate:
    name: Windows x64 launcher only (Git execution unverified)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: x64
      - name: Verify actual Windows x64 runtime
        run: python -c "import platform; assert platform.system() == 'Windows'; assert platform.machine().lower() in ('amd64', 'x86_64')"
      - name: Exercise managed cmd and existing Python command dispatch
        run: python -B -m unittest discover -s tests -p test_windows_cli_install.py
      - name: Verify unsupported Git execution fails closed
        run: python -B -m unittest discover -s tests -p test_windows_process_boundary.py
